<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voicewire capture</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f1419;
        --fg: #e8eef4;
        --muted: #8b9aab;
        --accent: #3d9cfd;
        --danger: #ff6b6b;
        --ok: #3ecf8e;
        --panel: #1a222c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #1d3a5c 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #163528 0%, transparent 50%),
          var(--bg);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        width: min(28rem, 100%);
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
        border-radius: 1rem;
        padding: 1.75rem;
        backdrop-filter: blur(8px);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.45;
      }
      .row {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.65rem;
        padding: 0.75rem 1.1rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        color: #041018;
        background: var(--accent);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.stop {
        background: var(--danger);
        color: #fff;
      }
      #status {
        margin-top: 1rem;
        font-size: 0.95rem;
        color: var(--muted);
        min-height: 1.4em;
      }
      #status.ok { color: var(--ok); }
      #status.err { color: var(--danger); }
      .pulse {
        display: inline-block;
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--danger);
        margin-right: 0.45rem;
        animation: pulse 1s ease-in-out infinite;
        vertical-align: middle;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Voicewire</h1>
      <p>Record from this browser mic, then upload to the local CLI for Whisper + Claude.</p>
      <div class="row">
        <button id="start" type="button">Start recording</button>
        <button id="stop" class="stop" type="button" disabled>Stop &amp; upload</button>
      </div>
      <div id="status">Idle — grant microphone access when prompted.</div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
